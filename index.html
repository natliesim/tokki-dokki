<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d9cfbb" />
    <title>Sky Hopper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #d9cfbb radial-gradient(circle at 50% 40%, #e6ddcb, #c9bda5);
      }
      canvas {
        width: min(100vw, calc(100vh * 2 / 3));
        width: min(100vw, calc(100dvh * 2 / 3));
        aspect-ratio: 2 / 3;
        display: block;
        box-shadow: 0 10px 30px rgba(60, 45, 20, 0.25);
        user-select: none; -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
